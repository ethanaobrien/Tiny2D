<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Platformer</title>
  <style>
    body { margin: 0; min-width: 1312px; min-height: 100vh; display: grid; place-items: center;
           background: #25354d; font: 18px system-ui, sans-serif; color: #fff; }
    main { width: 1280px; text-align: center; }
    canvas { display: block; width: 1280px; height: 720px; background: #b7def3;
             box-shadow: 0 16px 48px #101c2b; }
    p { margin: 18px 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
    <p>Click the game, then use ← → to move, ↑ to jump, and ↓ to restart.</p>
  </main>
  <script src="build-em/game.js"></script>
  <script>
    GAME_2({ canvas: document.getElementById('canvas') });
  </script>
</body>
</html>
